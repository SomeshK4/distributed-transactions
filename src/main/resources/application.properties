spring.application.name=demo-xa

# --- Disable Boot's default DataSource auto-config -------------------------
# We supply our own XA-wrapped DataSource in XaDatasourceConfig.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration

# --- JPA --------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
# Hibernate must use the JTA platform so it joins the active XA transaction.
spring.jpa.properties.hibernate.transaction.coordinator_class=jta
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_STATEMENT

# --- Atomikos ---------------------------------------------------------------
spring.jta.enabled=true

# --- Logging ----------------------------------------------------------------
logging.level.com.atomikos=INFO
logging.level.org.springframework.transaction=INFO
logging.level.org.springframework.jms=INFO
logging.level.org.hibernate.SQL=INFO

# -- Artemis -----
spring.artemis.broker-url=tcp://localhost:61616
spring.artemis.user=artemis
spring.artemis.password=artemis

# -- PostgreSQL -----
spring.datasource.url=jdbc:postgresql://localhost:5432/swift_ref
spring.datasource.username=postgres
spring.datasource.password=postgres